# CI. What can be checked without a registry, and why this job builds one anyway.
#
# `.data/registry.db` is gitignored and is built by `registry:ingest` from the committed sources in
# data/seed/. The two suites that matter most — repo/smoke.test.ts, which calls every read function against
# the real database, and repo/render.test.ts, which renders the real routes — SKIP CLEANLY when it is absent.
# So a run that did not build it would prove the types, the lint and the pure logic, and would prove nothing
# about the SQL or the pages. That is a green badge over the half of the suite that finds the defects, which
# is worse than no badge, so this builds the registry and takes the minutes.
#
# The workflow this replaced triggered /api/cron/scrape-results, a route that no longer exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite, and the type-stripping loader the .ts entry points rely on.
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Types — the app
        run: npm run type-check
      - name: Types — the registry package
        run: npm run registry:typecheck
      - name: Lint
        run: npm run lint

      - name: Build the registry
        run: |
          npm run registry:migrate
          npm run registry:ingest
          npm run registry:resolve

      # THE MAPS ARE PART OF THE REGISTRY NOW, so CI has to build them or it tests a different product from
      # the one that ships. repo/render.test.ts asserts Karnataka draws 224 of 224, that a state's Lok Sabha
      # map exists, that the polygons' licence is in the evidence drawer, and that the parties appearing in
      # one legend separate — and every one of those is false against a registry with only the seed's West
      # Bengal geometry in it.
      #
      # 57 MB of download per run, and deterministic: data/geo/sources.json declares each dataset's sha256
      # and `fetch` refuses bytes that do not match it. `--replace` because the seed writes 294 West Bengal
      # polygons in the old projection and the published set supersedes them.
      - name: Build the electoral geometry
        run: |
          npm run mandate -- geography fetch
          npm run mandate -- geography import --apply --replace

      - name: Validate
        run: |
          npm run mandate -- geography validate
          npm run mandate -- elections validate
          npm run mandate -- geography check

      # The registry invariants (ADR 0001). `audit` exits 1 when one is violated, and nothing else in this job
      # runs them against a built registry, so a defect in a write path was visible only to whoever ran the
      # command by hand. They were measured green when the CLI gained the command.
      - name: Registry invariants
        run: npm run registry:audit

      # The tests that fail on every run are listed in .github/test-baseline.txt, one name per line, and this step
      # fails only on a failure that is not listed. `|| true` would hide a new failure, and a count would let one
      # test's fix pay for another's break. The run names what it found as annotations (read them with
      # `gh api repos/<owner>/<repo>/check-runs/<job id>/annotations`): the new failures as an error, every failing
      # test as a notice, and any listed test that now passes, whose line should then be deleted.
      - name: Tests
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          set -e
          export LC_ALL=C

          # Node prints the spec reporter ("✖ name (1.2ms)", "ℹ fail N") on a terminal and TAP ("not ok N - name",
          # "# fail N") when its output is piped, as it is here under Node 22. Read either. This step once looked
          # for the spec form only, found nothing, and reported 99 failures on every run.
          ran=$(grep -E '^(ℹ|#) tests ' /tmp/test.log | tail -1 | grep -oE '[0-9]+' || true)
          reported=$(grep -E '^(ℹ|#) fail ' /tmp/test.log | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "${ran}" ] || [ -z "${reported}" ]; then
            echo "::error title=No test summary::npm test printed no summary, so the run did not finish"
            exit 1
          fi

          {
            grep -E '^✖ ' /tmp/test.log | grep -vx '✖ failing tests:' | sed -E 's/^✖ //; s/ \([0-9.]+ms\)$//'
            grep -E '^not ok [0-9]+ - ' /tmp/test.log | sed -E 's/^not ok [0-9]+ - //'
          } | sort -u > /tmp/failing.txt || true
          found=$(awk 'NF' /tmp/failing.txt | wc -l | tr -d ' ')
          if [ "${reported}" -gt 0 ] && [ "${found}" -eq 0 ]; then
            echo "::error title=Failing tests unreadable::the summary reports ${reported} failing but none could be named"
            exit 1
          fi

          sort -u .github/test-baseline.txt > /tmp/baseline.txt
          comm -13 /tmp/baseline.txt /tmp/failing.txt > /tmp/new.txt
          comm -23 /tmp/baseline.txt /tmp/failing.txt > /tmp/fixed.txt
          echo "tests: ${ran}, failing: ${reported} (${found} distinct names), not in .github/test-baseline.txt: $(awk 'NF' /tmp/new.txt | wc -l | tr -d ' ')"

          annotate() {
            [ -s "$3" ] || return 0
            echo "::$1 title=$2::$(sed 's/%/%25/g' "$3" | awk '{printf "%s%%0A", $0}')"
          }
          annotate error "Failing tests not in test-baseline.txt" /tmp/new.txt
          annotate notice "Baseline tests that now pass - remove them from test-baseline.txt" /tmp/fixed.txt
          annotate notice "Every failing test on this run" /tmp/failing.txt

          test ! -s /tmp/new.txt

      # Somewhere other than .next, which is what a dev server owns. MANDATE_DIST exists because a
      # verification build replacing that directory broke a running server three times.
      - name: Production build
        run: MANDATE_DIST=.next-verify npx next build

      # The round-trip ratchet. Its floor moves UP only, in the commit that raises the number — the failure
      # message says so and Phase 3's closure earned 94.1 -> 95.0 rather than arranging it. A red here means
      # the registry gives back less of data/seed/ than it did.
      - name: Seed round trip
        run: npm run mandate -- export

      # There is no step here that regenerates docs/geo and docs/release and fails on a difference. It was tried, and
      # it cannot pass in this job: those reports are generated from the full registry (every state's elections
      # and the sources behind them), and this job builds only the registry that data/seed/ and the fetched
      # geometry give, so the regenerated coverage tables lose every state the seed does not hold. Regenerate them
      # where a full registry exists — `npm run mandate -- geography coverage --write`, `geography missing
      # --write`, `geography inspect --write` and `release --write` — and commit the result.
